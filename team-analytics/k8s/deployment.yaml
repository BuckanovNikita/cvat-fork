# Team Analytics service: one process that sets up its schema, refreshes the stored totals on a
# schedule and serves /team-analytics-api/v1/ on port 8000. The image is built by
# build-team-analytics-service.sh and is not published to a registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-analytics
  labels:
    app.kubernetes.io/name: team-analytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: team-analytics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: team-analytics
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: team-analytics
          image: cvat/team-analytics:v2.82.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            # CLICKHOUSE_HOST, CLICKHOUSE_PORT, CLICKHOUSE_DB, CLICKHOUSE_USER, CLICKHOUSE_PASSWORD
            - secretRef:
                name: cvat-analytics-secret
            - configMapRef:
                name: team-analytics
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # no health endpoint: an open port means the schema is set up and the server is up
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
