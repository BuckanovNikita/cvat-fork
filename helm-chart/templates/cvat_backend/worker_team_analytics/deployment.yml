{{- /*
Fork: the worker of Team Analytics (cvat/apps/team_analytics). It computes the answers the API serves
from its cache and refreshes the stored totals, so that the API server never queries ClickHouse for
the feature (docs/adr/0006-team-analytics-inside-the-backend-with-reads-on-a-worker.md). Rendered
only where analytics is enabled: without it the app, its queue and this worker do not exist.

Its values live under cvat.backend.worker.teamAnalytics and all have defaults here, so upstream's
values.yaml is not edited. A worker process runs one job at a time, and the refresh can hold one
process for most of a minute while history is being filled: numProcs is 3, which leaves two for reads.
*/ -}}
{{- if .Values.analytics.enabled }}
{{- $defaults := dict "replicas" 1 "numProcs" 3 "labels" dict "annotations" dict "resources" dict "affinity" dict "tolerations" list "additionalEnv" list "additionalVolumes" list "additionalVolumeMounts" list -}}
{{- $given := default dict .Values.cvat.backend.worker.teamAnalytics -}}
{{- $localValues := merge (deepCopy $given) $defaults -}}
{{- /* merge takes a zero for "not given": zero replicas, the worker stopped, must stay zero */ -}}
{{- if hasKey $given "replicas" }}{{- $_ := set $localValues "replicas" $given.replicas }}{{- end -}}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend-worker-team-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    app: cvat-app
    tier: backend
    component: worker-team-analytics
    {{- include "cvat.labels" . | nindent 4 }}
    {{- with merge $localValues.labels .Values.cvat.backend.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge $localValues.annotations .Values.cvat.backend.annotations }}
  annotations:
  {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ $localValues.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "cvat.selectorLabels" . | nindent 6 }}
      app: cvat-app
      tier: backend
      component: worker-team-analytics
  template:
    metadata:
      labels:
        app: cvat-app
        tier: backend
        component: worker-team-analytics
        {{- include "cvat.labels" . | nindent 8 }}
        {{- with merge $localValues.labels .Values.cvat.backend.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with merge $localValues.annotations .Values.cvat.backend.annotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cvat.backend.serviceAccountName" . }}
      containers:
        - name: cvat-backend
          image: {{ .Values.cvat.backend.image }}:{{ .Values.cvat.backend.tag }}
          imagePullPolicy: {{ .Values.cvat.backend.imagePullPolicy }}
          {{- with merge $localValues.resources .Values.cvat.backend.resources }}
          resources:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
          - "run"
          - "worker"
          - "team_analytics"
          env:
          {{ include "cvat.sharedBackendEnv" . | indent 10 }}
          {{- with concat .Values.cvat.backend.additionalEnv $localValues.additionalEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          - name: NUMPROCS
            value: {{ $localValues.numProcs | quote }}
          {{- $expectedWorkers := include "cvat.backend.worker.livenessProbe.workers" $localValues -}}
          {{- $probeArgs := list "team_analytics" "--expected-num-workers" $expectedWorkers -}}
          {{- $probeConfig := dict "args" $probeArgs "livenessProbe" $.Values.cvat.backend.worker.livenessProbe -}}
          {{ include "cvat.backend.worker.livenessProbe" $probeConfig | indent 10 }}
          volumeMounts:
          - mountPath: /home/django/data
            name: cvat-backend-data
            subPath: data
          - mountPath: /home/django/keys
            name: cvat-backend-data
            subPath: keys
          - mountPath: /home/django/logs
            name: cvat-backend-data
            subPath: logs
          {{- with concat .Values.cvat.backend.additionalVolumeMounts $localValues.additionalVolumeMounts }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
      initContainers:
      {{- include "cvat.backend.initContainers" . | nindent 8 }}
      {{- with merge $localValues.affinity .Values.cvat.backend.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with concat .Values.cvat.backend.tolerations $localValues.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.cvat.backend.defaultStorage.enabled }}
        - name: cvat-backend-data
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-backend-data"
        {{- end }}
        {{- with concat .Values.cvat.backend.additionalVolumes $localValues.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
