{{- /*
The ClickHouse schema, delivered as a secret the ClickHouse subchart runs on the
first start of an empty database. Point `clickhouse.initdbScriptsSecret` at this
secret's name; the subchart requires a fixed name, so the name is a value rather
than a template.
*/ -}}
{{- if and .Values.analytics.enabled .Values.analytics.clickhouseInit.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.analytics.clickhouseInit.secretName | default "cvat-clickhouse-init" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cvat.labels" . | nindent 4 }}
    app: cvat-app
    tier: clickhouse
{{- if semverCompare ">=1.21-0" .Capabilities.KubeVersion.GitVersion }}
immutable: false
{{- end }}
data:
{{ (.Files.Glob "analytics/clickhouse/*.sh").AsSecrets | indent 2 }}
{{- end }}
