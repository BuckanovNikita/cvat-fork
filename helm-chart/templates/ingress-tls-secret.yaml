{{- /*
Create the ingress TLS secret from values instead of managing it outside the
chart. The certificate and key are read from the top-level `tlscrt` and `tlskey`
keys, which is where a secrets file keeps them, so switching this on never
requires re-encrypting a secret.
*/ -}}
{{- if and .Values.ingress.enabled .Values.ingress.tlsSecret.create }}
{{- $name := required "ingress.tlsSecretName must name the secret to create" .Values.ingress.tlsSecretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "ingress.tlsSecret.create needs the certificate in the top-level tlscrt value" .Values.tlscrt | b64enc }}
  tls.key: {{ required "ingress.tlsSecret.create needs the key in the top-level tlskey value" .Values.tlskey | b64enc }}
{{- end }}
