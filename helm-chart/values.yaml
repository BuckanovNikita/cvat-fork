# https://artifacthub.io/packages/helm/bitnami/redis
redis:
  enabled: true
  image:
    registry: docker.io
    repository: library/redis
    tag: 7.2.11
  external:
    host: 127.0.0.1
  architecture: standalone
  auth:
    existingSecret: "{{ .Release.Name }}-redis-secret"
    existingSecretPasswordKey: password
  secret:
    create: true
    name: "{{ .Release.Name }}-redis-secret"
    password: cvat_redis

nuclio:
  enabled: false
  dashboard:
    containerBuilderKind: kaniko
    # Host the backend uses to reach the nuclio dashboard. The dashboard chart
    # creates a Service of this name, so a deployment that installs that chart
    # with a different release name sets it here.
    host: "{{ .Release.Name }}-nuclio-dashboard"
# See https://github.com/nuclio/nuclio/blob/master/hack/k8s/helm/nuclio/values.yaml for more info
#  registry:
#    loginUrl: someurl
#    credentials:
#      username: someuser
#      password: somepass

analytics:
  # Set clickhouse.enabled to false if you disable analytics or use an external database
  enabled: true
  ingress:
    annotations: {}
  clickhouseDb: cvat
  clickhouseUser: user
  clickhousePassword: user
  clickhouseHost: "{{ .Release.Name }}-clickhouse"
  clickhousePort: 8123
  # Render the ClickHouse schema as a secret the ClickHouse subchart runs on
  # first start. Off by default: point `clickhouse.initdbScriptsSecret` at the
  # secret's name when you switch it on.
  clickhouseInit:
    enabled: false
    secretName: cvat-clickhouse-init

vector:
  envFrom:
    - secretRef:
        name: cvat-analytics-secret
  existingConfigMaps:
    - cvat-vector-config
  dataDir: "/vector-data-dir"
  containerPorts:
    - name: http
      containerPort: 8282
      protocol: TCP
  service:
    ports:
      - name: http
        port: 8282
        protocol: TCP
  image:
    tag: "0.26.0-alpine"
  securityContext:
    runAsNonRoot: true

    # Workaround for <https://github.com/vectordotdev/vector/issues/1599>.
    runAsUser: 1000
    runAsGroup: 1000

clickhouse:
  # Set to false in case of external db usage
  enabled: true
  image:
    registry: docker.io
    repository: cvat/clickhouse
    tag: 23.12.2-debian-11-r0
  shards: 1
  replicaCount: 1
  extraEnvVarsSecret: cvat-analytics-secret
  auth:
    username: user
    existingSecret: cvat-analytics-secret
    existingSecretKey: CLICKHOUSE_PASSWORD
  # Consider enabling zookeeper if a distributed configuration is used
  zookeeper:
    enabled: false

grafana:
  envFromSecret: cvat-analytics-secret
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: 'ClickHouse'
        type: 'grafana-clickhouse-datasource'
        isDefault: true
        jsonData:
          defaultDatabase: ${CLICKHOUSE_DB}
          port: ${CLICKHOUSE_PORT}
          server: ${CLICKHOUSE_HOST}
          username: ${CLICKHOUSE_USER}
          tlsSkipVerify: false
          protocol: http
        secureJsonData:
          password: ${CLICKHOUSE_PASSWORD}
        editable: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
  dashboardsConfigMaps:
    default: "cvat-grafana-dashboards"
  plugins:
    - grafana-clickhouse-datasource 4.8.2
  grafana.ini:
    server:
      root_url: https://cvat.local/analytics
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/all_events.json
    users:
      viewers_can_edit: true
    auth:
      disable_login_form: true
      disable_signout_menu: true
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth.basic:
      enabled: false

ingress:
  ## @param ingress.enabled Enable ingress resource generation for CVAT
  ##
  enabled: false
  ## @param ingress.hostname Host for the ingress resource
  ##
  hostname: cvat.local
  ## @param ingress.annotations Additional annotations for the Ingress resource.
  ##
  ## e.g:
  ## annotations:
  ##   kubernetes.io/ingress.class: nginx
  ##
  annotations: {}
  ## @param ingress.className IngressClass that will be used to implement the Ingress (Kubernetes 1.18+)
  ## This is supported in Kubernetes 1.18+ and required if you have more than one IngressClass marked as the default for your cluster
  ## ref: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/
  ##
  className: ""
  ## @param ingress.tls Enable TLS configuration for the host defined at `ingress.hostname` parameter
  ## TLS certificates will be retrieved from a TLS secret defined in tlsSecretName parameter
  ##
  tls: false
  ## @param ingress.tlsSecretName Specifies the name of the secret containing TLS certificates. Ignored if ingress.tls is false
  ##
  tlsSecretName: ingress-tls-cvat
  ## Paths that must not be served but answered with a permanent redirect to
  ## `ingress.hostname` instead, for example a registration endpoint that is
  ## closed on a private deployment. Each path becomes one rule on a single
  ## ingress. Empty renders nothing.
  ##
  redirectPaths: []
  ## @param ingress.redirectCode Status code of those redirects
  ##
  redirectCode: 308
  ## Create the TLS secret from the certificate and key values instead of
  ## managing it outside the chart. The values are read from the top-level
  ## `tlscrt` and `tlskey` keys, which is where a werf secrets file keeps them.
  ## The secret is created under `ingress.tlsSecretName`, the same name the
  ## ingress refers to, so there is no second name to keep in step.
  tlsSecret:
    create: false

traefik:
  enabled: false
  logs:
    general:
      format: json
    access:
      enabled: true
      format: json
      fields:
        general:
          defaultmode: drop
          names:
            ClientHost: keep
            DownstreamContentSize: keep
            DownstreamStatus: keep
            Duration: keep
            RequestHost: keep
            RequestMethod: keep
            RequestPath: keep
            RequestPort: keep
            RequestProtocol: keep
            RouterName: keep
            StartUTC: keep
  providers:
    kubernetesIngress:
      allowEmptyServices: true

smokescreen:
  opts: ''

imageTagsGuard:
  ## Fail the render unless every guarded image reference is set and its tag is
  ## immutable. Off by default: the chart's own values carry public image tags,
  ## and a deployment that supplies them at deploy time switches this on so a
  ## missing or mutable reference cannot silently run.
  enabled: false
  ## A tag counts as immutable when it ends in the short commit the build
  ## published, for example <release-line>-0a1b2c3d.
  tagPattern: "^[0-9A-Za-z_.-]+-[0-9a-f]{8}$"
  ## Components to guard. Each name maps to a reference the chart renders:
  ## backend, frontend, grafana, opa, kvrocks. Grafana is only rendered while
  ## `analytics.enabled` is true, so leave it out of this list there.
  components:
    - backend
    - frontend
    - grafana
