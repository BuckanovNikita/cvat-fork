# Default values for cvat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

cvat:
  ingress:
    annotations: {}
  backend:
    labels: {}
    annotations: {}
    resources: {}
    affinity: {}
    tolerations: []
    additionalEnv: []
    numProxies: 1

    # Applied to the server and initializer containers when set. Left empty the
    # containers keep the image's own user and only runAsNonRoot is enforced,
    # which is enough for a volume the image owns. A deployment whose shared
    # volume is written by another uid pins both here.
    runAsUser: ""
    runAsGroup: ""

    # This should only be used by supercharts;
    # to set custom environment for a Helm release, use additionalEnv.
    extensionEnv: {}

    additionalVolumes: []
    additionalVolumeMounts: []
    # Support for Bitnami legacy chart:
    # This setting is used to override Redis service name.
    # Bitnami chart require "cvat-redis-master" override. CloudPirates chart does not need this override.
    # If you use external Redis, use .Values.redis.external.host = your_redis_service + .Values.redis.enabled = false instead
    redisInmemHostOverride: "{{ .Release.Name }}-redis-master"
    # -- The service account the backend pods will use to interact with the Kubernetes API
    serviceAccount:
      name: default

    initializer:
      enabled: true
      labels: {}
      annotations: {}
      resources: {}
      affinity: {}
      tolerations: []
      additionalEnv: []
      additionalVolumes: []
      additionalVolumeMounts: []
    server:
      replicas: 1
      labels: {}
      annotations: {}
      resources: {}
      affinity: {}
      tolerations: []
      envs:
        ALLOWED_HOSTS: "*"
      additionalEnv: []
      additionalVolumes: []
      additionalVolumeMounts: []
      readinessProbe:
        enabled: true
        periodSeconds: 15
        initialDelaySeconds: 15
      livenessProbe:
        enabled: true
        periodSeconds: 15
        failureThreshold: 5
        initialDelaySeconds: 60
    worker:
      livenessProbe:
        enabled: true
        periodSeconds: 120
        initialDelaySeconds: 30
        timeoutSeconds: 10
      export:
        replicas: 2
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
      import:
        replicas: 2
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
      annotation:
        replicas: 1
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
      webhooks:
        replicas: 1
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
        terminationGracePeriodSeconds: 30
      qualityreports:
        replicas: 1
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
      chunks:
        replicas: 2
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
      consensus:
        replicas: 1
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
      utils:
        replicas: 1
        numProcs: 1
        labels: {}
        annotations: {}
        resources: {}
        affinity: {}
        tolerations: []
        additionalEnv: []
        additionalVolumes: []
        additionalVolumeMounts: []
    replicas: 1
    image: cvat/server
    tag: v2.82.0
    imagePullPolicy: Always
    permissionFix:
      enabled: true
      image: busybox
      tag: 1.36.1
      imagePullPolicy: IfNotPresent
      # Replaces the whole command, not arguments appended to one: give the
      # program first. Leave it unset to chmod `paths` with /bin/chmod.
      # commandOverride: ["/bin/chmod", "-R", "777", "/home/django"]
      paths:
        - /home/django
    service:
      annotations: {}
      spec:
        type: ClusterIP
        ports:
          - port: 8080
            targetPort: 8080
            protocol: TCP
            name: http
    defaultStorage:
        enabled: true
#        storageClassName: default
#        accessModes:
#         - ReadWriteMany
        size: 20Gi
  frontend:
    replicas: 1
    image: cvat/ui
    tag: v2.82.0
    imagePullPolicy: Always
    labels: {}
    #  test: test
    annotations: {}
    # test.io/test: test
    resources: {}
    affinity: {}
    tolerations: []
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/e2e-az-name
    #         operator: In
    #         values:
    #         - e2e-az1
    #         - e2e-az2
    additionalEnv: []
    # Example:
    #  - name: volume-from-secret
    # - name: TEST
    #  value: "test"
    additionalVolumes: []
    # Example(assumes that pvc was already created):
    # - name: tmp
    #   persistentVolumeClaim:
    #       claimName: tmp
    additionalVolumeMounts: []
    # Example:
    # -   mountPath: /tmp
    #     name: tmp
    #     subPath: test
    readinessProbe:
      enabled: true
      periodSeconds: 10
      failureThreshold: 5
    livenessProbe:
      enabled: true
      periodSeconds: 10
      failureThreshold: 5
    service:
      type: ClusterIP
      ports:
        - port: 8000
          targetPort: 8000
          protocol: TCP
          name: http
  opa:
    replicas: 1
    # Name of the Service the backend talks to. The backend reads it from
    # CVAT_OPA_URL, which is built from this value, so the two can never point
    # at different objects. Deployments that expect the bare name "opa" (the
    # default IAM_OPA_URL in the server settings) set this to "opa".
    serviceName: "{{ .Release.Name }}-opa-service"
    image: openpolicyagent/opa
    tag: 1.12.2
    imagePullPolicy: IfNotPresent
    labels: {}
    #  test: test
    annotations: {}
    # test.io/test: test
    resources: {}
    affinity: {}
    tolerations: []
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/e2e-az-name
    #         operator: In
    #         values:
    #         - e2e-az1
    #         - e2e-az2
    additionalEnv: []
    # Example:
    #  - name: volume-from-secret
    # - name: TEST
    #  value: "test"
    additionalVolumes: []
    # Example(assumes that pvc was already created):
    # - name: tmp
    #   persistentVolumeClaim:
    #       claimName: tmp
    additionalVolumeMounts: []
    # Example:
    # -   mountPath: /tmp
    #     name: tmp
    #     subPath: test
    # Keep the default probe tied to bundle availability in normal deployments.
    # This makes OPA health reflect whether it has successfully loaded policy data
    # from the CVAT backend. Deployments may override this to plain `/health`
    # if they intentionally want process-health-only probes.
    probePath: /health?bundles
    readinessProbe:
      enabled: true
      periodSeconds: 15
      initialDelaySeconds: 15
    livenessProbe:
      enabled: true
      periodSeconds: 15
      initialDelaySeconds: 15
    service:
      type: ClusterIP
      ports:
        - port: 8181
          targetPort: 8181
          protocol: TCP
          name: http

  kvrocks:
    enabled: true
    external:
      host: kvrocks-external.localdomain
    existingSecret: "{{ .Release.Name }}-kvrocks-secret"
    secret:
      create: true
      name: "{{ .Release.Name }}-kvrocks-secret"
      password: cvat_kvrocks
    image: apache/kvrocks
    tag: 2.15.0
    imagePullPolicy: IfNotPresent
    labels: {}
    #  test: test
    annotations: {}
    # test.io/test: test
    resources: {}
    affinity: {}
    tolerations: []
    nodeAffinity: {}
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/e2e-az-name
    #         operator: In
    #         values:
    #         - e2e-az1
    #         - e2e-az2
    additionalEnv: []
    # Example:
    # - name: TEST
    #   value: "test"
    additionalVolumes: []
    # Example(assumes that pvc was already created):
    # - name: tmp
    #   persistentVolumeClaim:
    #       claimName: tmp
    additionalVolumeMounts: []
    # Example:
    # -   mountPath: /tmp
    #     name: tmp
    #     subPath: test
    readinessProbe:
      enabled: true
      periodSeconds: 10
      initialDelaySeconds: 30
    livenessProbe:
      enabled: true
      periodSeconds: 10
      initialDelaySeconds: 30
    defaultStorage:
      enabled: true
#     storageClassName: default
#     accessModes:
#       - ReadWriteOnce
      size: 100Gi
      # Value of the tier label on the data PVC. Empty keeps "kvrocks".
      # Deployments that select volumes by tier label set it to their tier.
      pvcTierLabel: ""
      annotations: {}
      volumeAttributesClass:
        create: false
#        name: "gp3-high-throughput"
#        provider: ebs.csi.aws.com
#        parameters:
#          type: gp3
#          provisioned-throughput: "250"

postgresql:
  #See https://github.com/bitnami/charts/blob/master/bitnami/postgresql/ for more info
  enabled: true # false for external db
  image:
    registry: docker.io
    repository: cvat/postgresql
    tag: 15.2.0-debian-11-r0
  external:
    # Ignored if an empty value is set
    host: ""
    # Ignored if an empty value is set
    port: ""
  # If not external following config will be applied by default
  auth:
    existingSecret: "{{ .Release.Name }}-postgres-secret"
    username: cvat
    database: cvat
  service:
    ports:
      postgresql: 5432
  secret:
    create: true
    name: "{{ .Release.Name }}-postgres-secret"
    password: cvat_postgresql
    postgres_password: cvat_postgresql_postgres
    replication_password: cvat_postgresql_replica

