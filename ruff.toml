line-length = 120
target-version = "py310"

# cvat/ is upstream's import and stays as upstream wrote it: no ruff run, by hand or
# from the check pipeline, may lint or reformat it. tools/git-filter-repo is vendored.
# force-exclude applies the exclusion to paths named on the command line as well.
extend-exclude = ["cvat", "tools/git-filter-repo"]
force-exclude = true

[lint]
# Stated rather than left to the version's default, which grew in ruff 0.16.
select = ["E4", "E7", "E9", "F"]
