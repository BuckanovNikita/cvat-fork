# Tools of the fork's check pipeline (prek.toml) that come from Python packages.
# uv.lock locks them; ruff.toml holds ruff's settings. Not a package: the table
# below only gives uv the Python range the lock is resolved for.
[project]
name = "cvat-fork-checks"
version = "0"
requires-python = ">=3.10"

[dependency-groups]
lint = ["ruff==0.17.3"]

[tool.uv]
package = false
