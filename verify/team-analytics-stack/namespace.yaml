# Namespace of one Team Analytics test stack, with its quota and default limits.
# __NAMESPACE__ is replaced by run.sh. Most chart pods declare no resources, so the
# LimitRange gives them requests and limits; the quota bounds the whole stack.
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: cvat-fork-team-analytics-stack
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-analytics-stack
  namespace: __NAMESPACE__
spec:
  hard:
    pods: "30"
    requests.cpu: "6"
    requests.memory: 12Gi
    limits.cpu: "40"
    limits.memory: 56Gi
    persistentvolumeclaims: "10"
    requests.storage: 20Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-analytics-stack
  namespace: __NAMESPACE__
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "2"
        memory: 3Gi
