# Throwaway verification stack: unique container names and ports so it cannot
# collide with the deployment that owns the default `cvat` project.
services:
  cvat_clickhouse:
    container_name: verify_cvat_clickhouse
  cvat_db:
    container_name: verify_cvat_db
  cvat_grafana:
    container_name: verify_cvat_grafana
  cvat_opa:
    container_name: verify_cvat_opa
  cvat_redis_inmem:
    container_name: verify_cvat_redis_inmem
  cvat_redis_ondisk:
    container_name: verify_cvat_redis_ondisk
  cvat_server:
    container_name: verify_cvat_server
  cvat_ui:
    container_name: verify_cvat_ui
    image: cvat/ui:v2.82.0-progress-colors
  cvat_vector:
    container_name: verify_cvat_vector
  cvat_worker_annotation:
    container_name: verify_cvat_worker_annotation
  cvat_worker_chunks:
    container_name: verify_cvat_worker_chunks
  cvat_worker_consensus:
    container_name: verify_cvat_worker_consensus
  cvat_worker_export:
    container_name: verify_cvat_worker_export
  cvat_worker_import:
    container_name: verify_cvat_worker_import
  cvat_worker_quality_reports:
    container_name: verify_cvat_worker_quality_reports
  cvat_worker_utils:
    container_name: verify_cvat_worker_utils
  cvat_worker_webhooks:
    container_name: verify_cvat_worker_webhooks
  traefik:
    container_name: verify_traefik
    ports:
      - 8181:8080
      - 8191:8090
